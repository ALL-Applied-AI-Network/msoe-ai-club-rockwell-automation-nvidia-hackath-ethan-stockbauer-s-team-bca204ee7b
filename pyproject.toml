[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixing-copilot"
version = "0.1.0"
description = "Auditable color and temporal analysis for the CSI vial-fill line"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "scikit-image>=0.23,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]
tcn = ["torch>=2.3,<3"]

[project.scripts]
mixing-copilot = "mixing_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["csi_project/digital_twin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
